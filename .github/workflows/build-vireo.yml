name: Build Vireo Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Update 9 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s Vireo_Android_Source_For_GitHub.zip || {
            echo "ERROR: Vireo_Android_Source_For_GitHub.zip is missing or empty."
            exit 1
          }
          sha256sum Vireo_Android_Source_For_GitHub.zip | tee source-sha256.txt

      - name: Extract Update 9 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vireo_android_src
          mkdir -p vireo_android_src
          unzip -q Vireo_Android_Source_For_GitHub.zip -d vireo_android_src
          test -s vireo_android_src/settings.gradle
          test -s vireo_android_src/build.gradle
          test -s vireo_android_src/gradle.properties
          test -s vireo_android_src/app/build.gradle
          grep -Fq "update9-ffmpeg-runtime-dependency-fix" vireo_android_src/app/build.gradle

      - name: Preflight Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^android\.useAndroidX[[:space:]]*=[[:space:]]*true[[:space:]]*$' vireo_android_src/gradle.properties
          ! grep -Eq '^android\.useAndroidX[[:space:]]*=[[:space:]]*false[[:space:]]*$' vireo_android_src/gradle.properties
          grep -Fq "androidx.activity:activity:1.13.0" vireo_android_src/app/build.gradle
          grep -Fq 'buildPython("python3.13")' vireo_android_src/app/build.gradle
          grep -Fq "versionCode 9" vireo_android_src/app/build.gradle
          grep -Fq "dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.7" vireo_android_src/app/build.gradle
          grep -Fq "com.arthenica:smart-exception-java:0.2.1" vireo_android_src/app/build.gradle
          grep -Fq "com.arthenica:smart-exception-common:0.2.1" vireo_android_src/app/build.gradle
          echo "Update 9 build configuration preflight OK." | tee vireo-build-config-preflight.log

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          check-latest: false

      - name: Verify exact Chaquopy build Python
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          test "$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.13"
          mkdir -p "$RUNNER_TEMP/vireo-python-bin"
          ln -sf "$PYTHON_BIN" "$RUNNER_TEMP/vireo-python-bin/python3.13"
          ln -sf "$PYTHON_BIN" "$RUNNER_TEMP/vireo-python-bin/python3"
          echo "$RUNNER_TEMP/vireo-python-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vireo-python-bin/python3.13" --version | tee python-version.txt

      - name: Install CI-only Python test tools
        shell: bash
        run: |
          set -euo pipefail
          python3.13 -m pip install --disable-pip-version-check --no-input pytest==9.0.2
          python3.13 -m pytest --version | tee pytest-version.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          sdkmanager --list_installed | tee android-sdk-installed.txt
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 | head -n 1)"
          test -n "$APKANALYZER"
          echo "$APKANALYZER" | tee apkanalyzer-path.txt

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Reuse Vireo debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: vireo-android-debug-keystore-v1

      - name: Verify protected Android source contracts
        working-directory: vireo_android_src
        shell: bash
        run: |
          set -euo pipefail
          python3.13 -m compileall -q app/src/main/python
          python3.13 tools/verify_android_port.py | tee ../vireo-static-contract.log
          python3.13 -m pytest -q port_tests | tee ../vireo-port-tests.log

      - name: Resolve and verify runtime dependency graph
        working-directory: vireo_android_src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --refresh-dependencies :app:dependencies --configuration debugRuntimeClasspath \
            2>&1 | tee ../vireo-runtime-dependencies.log
          grep -Fq "com.arthenica:smart-exception-java:0.2.1" ../vireo-runtime-dependencies.log || {
            echo "ERROR: smart-exception-java is not on debugRuntimeClasspath."
            exit 1
          }
          grep -Fq "com.arthenica:smart-exception-common:0.2.1" ../vireo-runtime-dependencies.log || {
            echo "ERROR: smart-exception-common is not on debugRuntimeClasspath."
            exit 1
          }

      - name: Build Update 9 APK
        working-directory: vireo_android_src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../vireo-apk-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Run Android lint
        working-directory: vireo_android_src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:lintDebug 2>&1 | tee ../vireo-lint.log

      - name: Verify APK manifest native libraries and Java runtime classes
        shell: bash
        run: |
          set -euo pipefail
          APK="vireo_android_src/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -Fq "targetSdkVersion:'36'" apk-badging.txt
          grep -Fq "versionCode='9'" apk-badging.txt

          unzip -l "$APK" | tee apk-contents.txt >/dev/null
          for required in \
            'lib/arm64-v8a/libffmpegkit.so' \
            'lib/arm64-v8a/libavcodec.so' \
            'lib/arm64-v8a/libavfilter.so' \
            'lib/arm64-v8a/libpython3.13.so'; do
            grep -Fq "$required" apk-contents.txt || {
              echo "ERROR: APK is missing required native library: $required"
              exit 1
            }
          done

          # Critical runtime check: a mere reference is insufficient. The class
          # must be DEFINED in the APK DEX or FFmpegKitConfig will crash on device.
          APKANALYZER="$(cat apkanalyzer-path.txt)"
          test -x "$APKANALYZER"
          "$APKANALYZER" dex packages --defined-only "$APK" | tee apk-defined-dex-classes.txt
          grep -Fq "com.arthenica.smartexception.java.Exceptions" apk-defined-dex-classes.txt || {
            echo "ERROR: APK does not define com.arthenica.smartexception.java.Exceptions."
            exit 1
          }

      - name: Host render smoke diagnostic
        if: always()
        working-directory: vireo_android_src
        shell: bash
        continue-on-error: true
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            python3.13 tools/render_smoke_test.py 2>&1 | tee ../vireo-host-render-smoke.log
          else
            echo "Host ffmpeg/ffprobe unavailable; skipped (not an Android APK failure)." | tee ../vireo-host-render-smoke.log
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          cp vireo_android_src/app/build/outputs/apk/debug/app-debug.apk \
             Vireo-Video-Studio-Android13-16-Update9.apk
          sha256sum Vireo-Video-Studio-Android13-16-Update9.apk | tee apk-sha256.txt

      - name: Upload Vireo APK
        uses: actions/upload-artifact@v6
        with:
          name: Vireo-Video-Studio-APK
          path: Vireo-Video-Studio-Android13-16-Update9.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Vireo-build-diagnostics
          path: |
            source-sha256.txt
            vireo-build-config-preflight.log
            python-version.txt
            pytest-version.txt
            android-sdk-installed.txt
            apkanalyzer-path.txt
            vireo-static-contract.log
            vireo-port-tests.log
            vireo-runtime-dependencies.log
            vireo-apk-build.log
            vireo-lint.log
            vireo-host-render-smoke.log
            apk-badging.txt
            apk-contents.txt
            apk-defined-dex-classes.txt
            apk-sha256.txt
            vireo_android_src/app/build/reports/lint-results-debug.html
            vireo_android_src/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

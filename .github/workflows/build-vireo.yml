name: Build Vireo Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Get uploaded files
        uses: actions/checkout@v4

      - name: Verify Vireo source ZIP exists
        shell: bash
        run: |
          test -f Vireo_Android_Source_For_GitHub.zip || {
            echo "ERROR: Vireo_Android_Source_For_GitHub.zip is missing from the repository root."
            exit 1
          }
          sha256sum Vireo_Android_Source_For_GitHub.zip

      - name: Extract Vireo Android Update 6 project
        shell: bash
        run: |
          rm -rf vireo_android_src
          mkdir -p vireo_android_src
          unzip -q Vireo_Android_Source_For_GitHub.zip -d vireo_android_src
          test -f vireo_android_src/settings.gradle
          test -f vireo_android_src/app/build.gradle
          grep -q "update6-normalized-probe-selftest" vireo_android_src/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reuse Vireo debug signing key across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vireo-android-debug-keystore-v1

      - name: Run Vireo Update 6 protected-contract checks
        working-directory: vireo_android_src
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest requests pillow python-dotenv
          python -m compileall -q app/src/main/python
          python tools/verify_android_port.py
          PYTHONPATH="$PWD/app/src/main/python" pytest -q port_tests/test_android_port_contracts.py
          python tools/render_smoke_test.py

      - name: Android lint
        working-directory: vireo_android_src
        shell: bash
        run: gradle --no-daemon :app:lintDebug

      - name: Build installable Update 6 APK
        working-directory: vireo_android_src
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --refresh-dependencies :app:assembleDebug 2>&1 | tee ../vireo-apk-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK package contents
        shell: bash
        run: |
          set -euo pipefail
          APK="vireo_android_src/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
          grep -q "versionCode='6'" apk-badging.txt
          unzip -l "$APK" > apk-contents.txt
          grep -q 'lib/arm64-v8a/libffmpegkit.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libavcodec.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libavfilter.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libpython3.13.so' apk-contents.txt
          rm -rf apk_check && mkdir -p apk_check
          cd apk_check
          unzip -q "../$APK" lib/arm64-v8a/libavcodec.so lib/arm64-v8a/libavfilter.so
          strings lib/arm64-v8a/libavcodec.so > avcodec-strings.txt
          strings lib/arm64-v8a/libavfilter.so > avfilter-strings.txt
          grep -q 'mp3float' avcodec-strings.txt
          grep -q 'AAC decoder' avcodec-strings.txt
          grep -q '^subtitles$' avfilter-strings.txt
          grep -q '^silencedetect$' avfilter-strings.txt
          grep -q '^afftdn$' avfilter-strings.txt
          grep -q '^alimiter$' avfilter-strings.txt

      - name: Rename APK
        if: success()
        shell: bash
        run: cp vireo_android_src/app/build/outputs/apk/debug/app-debug.apk Vireo-Video-Studio-Android13-16-Update6.apk

      - name: Upload Vireo APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vireo-Video-Studio-APK
          path: Vireo-Video-Studio-Android13-16-Update6.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Vireo-build-log
          path: |
            vireo-apk-build.log
            apk-badging.txt
            vireo_android_src/app/build/reports/lint-results-debug.html
            vireo_android_src/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7

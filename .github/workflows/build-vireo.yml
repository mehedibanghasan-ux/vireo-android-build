name: Build Vireo Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Update 6 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s Vireo_Android_Source_For_GitHub.zip || {
            echo "ERROR: Vireo_Android_Source_For_GitHub.zip is missing or empty."
            exit 1
          }
          sha256sum Vireo_Android_Source_For_GitHub.zip | tee source-sha256.txt

      - name: Extract Update 6 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vireo_android_src
          mkdir -p vireo_android_src
          unzip -q Vireo_Android_Source_For_GitHub.zip -d vireo_android_src
          test -s vireo_android_src/settings.gradle
          test -s vireo_android_src/build.gradle
          test -s vireo_android_src/app/build.gradle
          grep -Fq "update6-normalized-probe-selftest" vireo_android_src/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify and expose exact Chaquopy build Python
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 13), sys.version
          print("Chaquopy build Python:", sys.executable)
          print("Version:", sys.version)
          PY
          mkdir -p "$RUNNER_TEMP/vireo-python-bin"
          ln -sf "$PYTHON_BIN" "$RUNNER_TEMP/vireo-python-bin/python3.13"
          ln -sf "$PYTHON_BIN" "$RUNNER_TEMP/vireo-python-bin/python3"
          echo "$RUNNER_TEMP/vireo-python-bin" >> "$GITHUB_PATH"
          echo "VIREO_CHAQUOPY_PYTHON=$PYTHON_BIN" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vireo-python-bin/python3.13" --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          sdkmanager --list_installed | tee android-sdk-installed.txt

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reuse Vireo debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vireo-android-debug-keystore-v1

      - name: Confirm Python 3.13 is visible to Chaquopy
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.13
          python3.13 --version
          test "$(python3.13 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.13"

      # Build first. Host-side Python/FFmpeg diagnostics must never prevent a
      # valid Android APK from being compiled simply because the runner image
      # differs from the Android runtime.
      - name: Build Update 6 APK
        working-directory: vireo_android_src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../vireo-apk-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Run Android lint
        working-directory: vireo_android_src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:lintDebug 2>&1 | tee ../vireo-lint.log

      - name: Verify protected source contracts
        working-directory: vireo_android_src
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q app/src/main/python
          python3 tools/verify_android_port.py | tee ../vireo-static-contract.log

      # This test exercises the desktop/host FFmpeg executable, not the APK's
      # embedded Android FFmpegKit. Keep it as diagnostics only. The app itself
      # performs a real on-device FFmpeg/FFprobe self-test before paid API work.
      - name: Host render smoke diagnostic
        if: always()
        working-directory: vireo_android_src
        shell: bash
        continue-on-error: true
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            python3 tools/render_smoke_test.py 2>&1 | tee ../vireo-host-render-smoke.log
          else
            echo "Host ffmpeg/ffprobe unavailable; skipped (not an Android APK failure)." | tee ../vireo-host-render-smoke.log
          fi

      - name: Verify APK manifest and required native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="vireo_android_src/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -Fq "targetSdkVersion:'36'" apk-badging.txt
          grep -Fq "versionCode='6'" apk-badging.txt
          unzip -l "$APK" | tee apk-contents.txt >/dev/null
          for required in \
            'lib/arm64-v8a/libffmpegkit.so' \
            'lib/arm64-v8a/libavcodec.so' \
            'lib/arm64-v8a/libavfilter.so' \
            'lib/arm64-v8a/libpython3.13.so'; do
            grep -Fq "$required" apk-contents.txt || {
              echo "ERROR: APK is missing required native library: $required"
              exit 1
            }
          done

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          cp vireo_android_src/app/build/outputs/apk/debug/app-debug.apk \
             Vireo-Video-Studio-Android13-16-Update6.apk
          sha256sum Vireo-Video-Studio-Android13-16-Update6.apk | tee apk-sha256.txt

      - name: Upload Vireo APK
        uses: actions/upload-artifact@v4
        with:
          name: Vireo-Video-Studio-APK
          path: Vireo-Video-Studio-Android13-16-Update6.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vireo-build-diagnostics
          path: |
            source-sha256.txt
            android-sdk-installed.txt
            vireo-apk-build.log
            vireo-lint.log
            vireo-static-contract.log
            vireo-host-render-smoke.log
            apk-badging.txt
            apk-contents.txt
            apk-sha256.txt
            vireo_android_src/app/build/reports/lint-results-debug.html
            vireo_android_src/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14
